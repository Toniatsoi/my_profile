<script>

  name:   "Leonard Anthony C. Quijada",
  first:  "Leonard Anthony",          // used in vCard
  last:   "Quijada",                  // used in vCard
  title:  "BS Computer Engineering Student",

  email:   "quijadaleonardanthony1@gmail.com",

  // Profile picture: put photo.jpg beside this file, or paste an image URL. Leave "" to show initials.

  // Social links. Leave a link as "" to hide that icon automatically.
  socials: {

    instagram: "",   // add later, e.g. https://www.instagram.com/YOUR_USERNAME,

</script>

<style>
:root{
  --ink:#10242b; --muted:#4f6770; --paper:#ffffff; --line:#e3ecee;
  --deep:#14313a; --deep2:#1d4a57; --accent:#e8a33d; --accent-ink:#3b2a07;
  --bg1:#d9eaec; --bg2:#f4f8f8;
  --shadow:0 18px 40px -18px rgba(16,36,43,.45);
}
@media (prefers-color-scheme: dark){
  :root{ --ink:#eaf3f4; --muted:#a9c0c6; --paper:#17262b; --line:#274149; --bg1:#0c181c; --bg2:#102126; --shadow:0 18px 40px -18px #000; }
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color:var(--ink); min-height:100vh; overflow-x:hidden; line-height:1.5;
  padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  background:
    radial-gradient(circle at 1px 1px, rgba(20,49,58,.10) 1px, transparent 0) 0 0/22px 22px,
    linear-gradient(160deg,var(--bg1),var(--bg2));
  display:flex; justify-content:center; padding-left:16px; padding-right:16px;
}
.card{
  width:100%; max-width:440px; margin:20px 0 28px; background:var(--paper);
  border-radius:28px; box-shadow:var(--shadow); overflow:hidden;
  animation:rise .6s ease both;
}
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

/* Header */
.hero{background:linear-gradient(150deg,var(--deep),var(--deep2));height:112px;position:relative}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 20%,rgba(232,163,61,.35),transparent 55%)}
.profile{text-align:center;padding:0 22px 8px;margin-top:-62px;position:relative;z-index:1}
.avatar{
  width:124px;height:124px;border-radius:50%;margin:0 auto 14px;border:5px solid var(--paper);
  background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;
  font-size:2.4rem;font-weight:800;overflow:hidden;box-shadow:0 8px 20px -8px rgba(0,0,0,.5);
}
.avatar img{width:100%;height:100%;object-fit:cover}
h1{font-size:1.6rem;line-height:1.2;letter-spacing:-.01em}
.title{color:var(--deep2);font-weight:700;margin-top:6px}
@media (prefers-color-scheme: dark){.title{color:var(--accent)}}
.bio{color:var(--muted);font-size:.97rem;margin-top:12px}

/* Buttons */
.section{padding:14px 22px}
.section h2{font-size:1.05rem;margin-bottom:10px}
.list{display:grid;gap:10px}
.row{
  display:flex;align-items:center;gap:14px;min-height:60px;padding:10px 12px;border-radius:16px;
  background:var(--bg2);border:1px solid var(--line);color:inherit;text-decoration:none;
  transition:transform .15s ease,box-shadow .15s ease,border-color .15s ease;
}
.row:hover{transform:translateY(-2px);box-shadow:0 10px 20px -14px rgba(0,0,0,.5);border-color:var(--deep2)}
.row:active{transform:scale(.98)}
.ico{flex:none;width:44px;height:44px;border-radius:14px;background:var(--deep);color:#fff;display:grid;place-items:center;font-size:1.1rem}
.txt{flex:1;min-width:0}
.txt small{display:block;color:var(--muted);font-size:.78rem}
.txt span{display:block;font-weight:600;overflow-wrap:anywhere}
.copy{
  flex:none;width:44px;height:44px;border:0;border-radius:12px;background:transparent;color:var(--muted);
  font-size:1.05rem;cursor:pointer;transition:background .15s,color .15s;
}
.copy:hover{background:var(--line);color:var(--ink)}
.copy.done{color:#1b9a5a}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{
  display:flex;align-items:center;justify-content:center;gap:8px;min-height:54px;padding:12px;border-radius:16px;
  font:inherit;font-weight:700;border:0;cursor:pointer;text-decoration:none;transition:transform .15s ease,filter .15s;
}
.btn:hover{filter:brightness(1.07);transform:translateY(-2px)}
.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.secondary{background:var(--deep);color:#fff}

/* Socials */
.socials{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.socials a{
  width:56px;height:56px;border-radius:50%;display:grid;place-items:center;font-size:1.5rem;color:#fff;
  background:var(--deep);text-decoration:none;transition:transform .15s ease,background .15s;
}
.socials a:hover{transform:translateY(-3px) scale(1.06)}
.socials a:active{transform:scale(.94)}
.socials a[data-p=facebook]:hover{background:#1877f2}
.socials a[data-p=instagram]:hover{background:#d62976}
.socials a[data-p=linkedin]:hover{background:#0a66c2}
.socials a[data-p=github]:hover{background:#24292f}
.socials a[data-p=tiktok]:hover{background:#000}
.socials a[data-p=youtube]:hover{background:#e00}

footer{text-align:center;color:var(--muted);font-size:.78rem;padding:10px 22px 22px}
a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
#toast{
  position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translate(-50%,20px);
  background:var(--deep);color:#fff;padding:12px 18px;border-radius:999px;font-weight:600;font-size:.9rem;
  opacity:0;pointer-events:none;transition:.25s;z-index:10;
}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media (max-width:360px){.actions{grid-template-columns:1fr}h1{font-size:1.4rem}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>
</head>
<body>
<main class="card">
  <div class="hero" aria-hidden="true"></div>

  <section class="profile">
    <div class="avatar" id="avatar" role="img" aria-label="Profile picture"></div>
    <h1 id="name"></h1>
    <p class="title" id="title"></p>
    <p class="bio" id="bio"></p>
  </section>

  <section class="section" id="contact" aria-labelledby="contact-h">
    <h2 id="contact-h">Contact</h2>
    <div class="list">
      <div class="row">
        <a id="phoneLink" class="row" style="border:0;background:none;padding:0;min-height:0;flex:1;box-shadow:none;transform:none">
          <span class="ico"><i class="fas fa-phone" aria-hidden="true"></i></span>
          <span class="txt"><small>Call me</small><span id="phoneText"></span></span>
        </a>
        <button class="copy" id="copyPhone" aria-label="Copy phone number"><i class="far fa-copy" aria-hidden="true"></i></button>
      </div>
      <div class="row">
        <a id="emailLink" class="row" style="border:0;background:none;padding:0;min-height:0;flex:1;box-shadow:none;transform:none">
          <span class="ico"><i class="fas fa-envelope" aria-hidden="true"></i></span>
          <span class="txt"><small>Email me</small><span id="emailText"></span></span>
        </a>
        <button class="copy" id="copyEmail" aria-label="Copy email address"><i class="far fa-copy" aria-hidden="true"></i></button>
      </div>
      <a class="row" id="mapLink" target="_blank" rel="noopener noreferrer">
        <span class="ico"><i class="fas fa-location-dot" aria-hidden="true"></i></span>
        <span class="txt"><small>Open in Google Maps</small><span id="locText"></span></span>
      </a>
      <a class="row" id="webLink" target="_blank" rel="noopener noreferrer">
        <span class="ico"><i class="fas fa-globe" aria-hidden="true"></i></span>
        <span class="txt"><small>Website / Portfolio</small><span id="webText"></span></span>
      </a>
    </div>
  </section>

  <section class="section">
    <div class="actions">
      <button class="btn primary" id="saveBtn"><i class="fas fa-address-book" aria-hidden="true"></i> Add to Contacts</button>
      <button class="btn secondary" id="shareBtn"><i class="fas fa-share-nodes" aria-hidden="true"></i> Share Contact</button>
    </div>
  </section>

  <section class="section" id="social" aria-labelledby="social-h">
    <h2 id="social-h">Social Media</h2>
    <div class="socials" id="socials"></div>
  </section>

  <footer id="foot"></footer>
</main>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
  const P = PROFILE, $ = id => document.getElementById(id);
  const isPlaceholder = v => !v || /XXXX|YOUR_|YOUR-|MYEMAIL/i.test(v);

  // Fill text
  $("name").textContent = P.name;
  $("title").textContent = P.title;
  $("bio").textContent = P.bio;
  $("phoneText").textContent = P.phoneDisplay;
  $("emailText").textContent = P.email;
  $("locText").textContent = P.location;
  $("webText").textContent = P.website.replace(/^https?:\/\//,"");
  $("foot").textContent = "© " + new Date().getFullYear() + " " + P.name;

  // Avatar: photo or initials
  const av = $("avatar");
  if (P.photo) {
    const img = new Image(); img.src = P.photo; img.alt = P.name + " profile picture";
    img.onerror = () => { av.textContent = initials(); };
    av.appendChild(img);
  } else av.textContent = initials();
  function initials(){ return (P.first[0] + P.last[0]).toUpperCase(); }

  // Links
  $("phoneLink").href = "tel:" + P.phoneRaw;
  $("emailLink").href = "mailto:" + P.email;
  $("mapLink").href = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(P.location);
  $("webLink").href = P.website;

  // Socials (hidden when empty)
  const icons = {
    facebook:["fab fa-facebook-f","Facebook"], instagram:["fab fa-instagram","Instagram"],
    linkedin:["fab fa-linkedin-in","LinkedIn"], github:["fab fa-github","GitHub"],
    tiktok:["fab fa-tiktok","TikTok"], youtube:["fab fa-youtube","YouTube"]
  };
  const box = $("socials");
  Object.keys(icons).forEach(k => {
    const url = P.socials[k]; if (!url) return;
    const a = document.createElement("a");
    a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer";
    a.dataset.p = k; a.setAttribute("aria-label", icons[k][1] + " profile");
    a.innerHTML = '<i class="' + icons[k][0] + '" aria-hidden="true"></i>';
    box.appendChild(a);
  });
  if (!box.children.length) $("social").hidden = true;

  // Toast
  let t; function toast(msg){
    const el = $("toast"); el.textContent = msg; el.classList.add("show");
    clearTimeout(t); t = setTimeout(() => el.classList.remove("show"), 2200);
  }

  // Copy buttons
  async function copy(text, btn, label){
    try { await navigator.clipboard.writeText(text); }
    catch(e){
      const ta = document.createElement("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove();
    }
    btn.classList.add("done"); btn.innerHTML = '<i class="fas fa-check" aria-hidden="true"></i>';
    toast(label + " copied");
    setTimeout(() => { btn.classList.remove("done"); btn.innerHTML = '<i class="far fa-copy" aria-hidden="true"></i>'; }, 1800);
  }
  $("copyPhone").onclick = e => copy(P.phoneRaw, e.currentTarget, "Phone number");
  $("copyEmail").onclick = e => copy(P.email, e.currentTarget, "Email");

  // vCard
  function buildVCard(){
    const esc = s => String(s).replace(/([,;\\])/g,"\\$1").replace(/\n/g,"\\n");
    const lines = [
      "BEGIN:VCARD","VERSION:3.0",
      "N:" + esc(P.last) + ";" + esc(P.first) + ";;;",
      "FN:" + esc(P.name),
      "ORG:" + esc(P.org),
      "TITLE:" + esc(P.title),
      "TEL;TYPE=CELL:" + P.phoneRaw,
      "EMAIL;TYPE=INTERNET:" + P.email,
      "URL:" + P.website,
      "ADR;TYPE=HOME:;;" + esc(P.location) + ";;;;",
      "END:VCARD"
    ];
    return lines.join("\r\n");
  }
  $("saveBtn").onclick = () => {
    const blob = new Blob([buildVCard()], {type:"text/vcard;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = P.last + "_" + P.first.replace(/\s+/g,"_") + ".vcf";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    toast("Contact file ready. Open it to save.");
  };

  // Share (Web Share API, falls back to copying the link)
  $("shareBtn").onclick = async () => {
    const data = { title: P.name, text: P.name + ", " + P.title, url: location.href };
    if (navigator.share) {
      try { await navigator.share(data); } catch(e){ /* cancelled */ }
    } else {
      copy(location.href, $("shareBtn"), "Card link");
      $("shareBtn").innerHTML = '<i class="fas fa-share-nodes" aria-hidden="true"></i> Share Contact';
    }
  };
})();
</script>
</body>
</html>
